name: 🚀 CI — Gully News

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  NODE_VERSION: "24"
  FRONTEND_DIR: ./frontend
  BACKEND_DIR: ./backend

jobs:

  frontend:
    name: 🖥️  Frontend — Lint · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: ${{ env.FRONTEND_DIR }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Run ESLint
        run: npx react-scripts lint --max-warnings 0
        continue-on-error: true

      - name: 🧪 Run tests with coverage
        run: npm run test:coverage
        env:
          CI: true
          REACT_APP_ENV: test

      - name: 📊 Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: ${{ env.FRONTEND_DIR }}/coverage
          retention-days: 7

      - name: 🏗️  Build production bundle
        run: npm run build
        env:
          CI: true
          GENERATE_SOURCEMAP: false

  backend:
    name: ⚙️  Backend — Lint · Test · Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: ${{ env.BACKEND_DIR }}

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: neondb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.BACKEND_DIR }}/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Run ESLint
        run: npx eslint . --ext .js --max-warnings 0
        continue-on-error: true

      - name: 🗄️  Initialise test database schema
        run: psql -h localhost -U postgres -d neondb_test -f init_db.sql
        env:
          PGPASSWORD: postgres

      - name: 🧪 Run Jest tests with coverage
        run: npm run test:coverage
        env:
          NODE_ENV: test
          PORT: 5000
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/neondb_test
          DB_USER: postgres
          DB_HOST: localhost
          DB_NAME: neondb_test
          DB_PASSWORD: postgres
          DB_PORT: 5432
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}

      - name: 📊 Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: ${{ env.BACKEND_DIR }}/coverage
          retention-days: 7

  security:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 🔍 Audit frontend dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
        continue-on-error: true

      - name: 🔍 Audit backend dependencies
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
        continue-on-error: true
