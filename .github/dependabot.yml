# =============================================================================
# Dependabot — Automated Dependency Updates
# =============================================================================
# Dependabot opens pull requests automatically when new versions of your
# dependencies are available. Combined with branch protection + required
# status checks, updates are only merged after CI passes.
#
# Schedules:
#   • npm (frontend)  → weekly on Monday at 09:00 IST (03:30 UTC)
#   • npm (backend)   → weekly on Monday at 09:00 IST (03:30 UTC)
#   • GitHub Actions  → weekly to keep action versions current and secure
# =============================================================================

version: 2

updates:
  # ---------------------------------------------------------------------------
  # Frontend npm dependencies
  # ---------------------------------------------------------------------------
  - package-ecosystem: npm
    directory: /frontend             # Path relative to the repository root
    schedule:
      interval: weekly
      day: monday
      time: "03:30"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5      # Avoid PR flood; batches minor updates
    labels:
      - dependencies
      - frontend
    commit-message:
      prefix: "chore(deps)"
    # Group all non-major React updates into a single PR to reduce noise
    groups:
      react-ecosystem:
        patterns:
          - "react*"
          - "@testing-library/*"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"

  # ---------------------------------------------------------------------------
  # Backend npm dependencies
  # ---------------------------------------------------------------------------
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "03:30"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - backend
    commit-message:
      prefix: "chore(deps)"
    groups:
      express-ecosystem:
        patterns:
          - "express*"
          - "cors"
          - "cookie-parser"
      auth:
        patterns:
          - "bcrypt"
          - "jsonwebtoken"

  # ---------------------------------------------------------------------------
  # Root-level npm dependencies (Playwright, etc.)
  # ---------------------------------------------------------------------------
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:30"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - e2e
    commit-message:
      prefix: "chore(deps)"

  # ---------------------------------------------------------------------------
  # GitHub Actions — keep action versions patched
  # ---------------------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:30"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "ci(actions)"
